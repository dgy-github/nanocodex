# Copy this file to ~/.nanocodex/connectors.toml and edit for your machine.
# Stdio connectors are launched when `ncx --mcp` starts. Remote transports are
# parsed and shown in `/mcp` for audit, including auth metadata, but are not
# launched until first-class OAuth login and remote transports land.

[connectors.fetch]
display_name = "Fetch"
description = "Fetch HTTP/HTTPS pages through an MCP connector."
transport = "stdio"
command = "cmd"
args = ["/c", "npx", "-y", "mcp-server-fetch"]
source = "npm:mcp-server-fetch"
enabled = true
trusted = false
permission = "ask"
# allowed_tools is enforced at registration time. Use raw or mcp__server__tool
# names; empty means all server tools.
allowed_tools = ["fetch"]

# Example remote connector spec. This is visible in `/mcp` but not launched yet.
# [connectors.remote_docs]
# display_name = "Remote Docs"
# description = "Remote MCP docs connector."
# transport = "sse"
# url = "https://example.com/mcp"
# auth = "oauth" # none | header | headers-helper | oauth
# headers = { Authorization = "Bearer ${TOKEN}" }
# headers_helper = "" # optional command that would mint headers; not executed yet
# enabled = false
# trusted = false
# permission = "ask"
#
# [connectors.remote_docs.oauth]
# client_id = "nanocodex-local"
# client_secret_env = "REMOTE_DOCS_CLIENT_SECRET" # env var name, not the secret
# callback_port = 8765
# scopes = ["docs:read", "search"]
# auth_server_metadata_url = "https://example.com/.well-known/oauth-authorization-server"
