name: CI

on:
  push:
    branches:
      - main
      - rust-capability
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW linker
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Format Rust workspace
        shell: pwsh
        run: cargo fmt --manifest-path rust\Cargo.toml --all --check

      - name: Test Rust workspace
        shell: pwsh
        run: cargo test --manifest-path rust\Cargo.toml --workspace --target x86_64-pc-windows-gnu

      - name: Format Tauri backend
        shell: pwsh
        run: cargo fmt --manifest-path rust\gui\src-tauri\Cargo.toml --all --check

      - name: Check Tauri backend
        shell: pwsh
        run: cargo check --manifest-path rust\gui\src-tauri\Cargo.toml --target x86_64-pc-windows-gnu

  python:
    name: Python offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest -q
